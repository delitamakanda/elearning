name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lancé par l'agent sur ses branches (une PR créée avec GITHUB_TOKEN ne déclenche pas `pull_request`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.3

      - name: Check
        run: python manage.py check

      - name: Run Tests
        run: python manage.py test

      - name: Ruff (fichiers modifiés)
        if: github.ref != 'refs/heads/master'
        env:
          BASE_REF: origin/master
        run: bash scripts/agent/lint-changed.sh --check
